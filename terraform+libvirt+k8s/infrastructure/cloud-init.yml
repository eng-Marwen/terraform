#cloud-config

# ============================================================
# Network
# ============================================================

network:
  version: 2
  renderer: networkd

  ethernets:
    primary:
      match:
        driver: virtio_net
      dhcp4: true
      dhcp-identifier: mac
      optional: true


# ============================================================
# User Configuration
# ============================================================

users:
  - name: ubuntu

    groups:
      - sudo

    shell: /bin/bash

    # Allow the ubuntu user to execute sudo commands
    # without entering a password.
    sudo: ALL=(ALL) NOPASSWD:ALL

    # Disable password-based login.
    lock_passwd: true

    # SSH public key used to access the VM.
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOGFSPGsxRFiexvroYiu9Vw3y/00s00LlgMcH/rbF+Qa marwen@laptop


# ============================================================
# SSH
# ============================================================

# Disable SSH password authentication.
# Authentication will use the SSH key above.
ssh_pwauth: false


# ============================================================
# Package Installation
# ============================================================

# Update the package index during first boot.
package_update: true

packages:
  # Allows libvirt/KVM to communicate with the guest.
  - qemu-guest-agent


# ============================================================
# Commands
# ============================================================

runcmd:
  # Start the QEMU Guest Agent immediately
  # and enable it automatically at boot.
  - systemctl enable --now qemu-guest-agent

